name: AyzEla 08:00 TRT Günlük Analiz

on:
  schedule:
    # 08:00 Europe/Istanbul (UTC+3) = 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  analyze-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Istanbul
      DB_BACKEND: d1
      FREE_ONLY_MODE: "true"
      TELEGRAM_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PANEL_BASE_URL: ${{ secrets.PANEL_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/run_daily_analysis.py --run-type morning_0800 --no-telegram
