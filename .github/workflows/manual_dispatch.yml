name: AyzEla Manuel Görev Tetikleme

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Kuyruk İş ID'
        required: false
      task:
        description: 'Görev tipi (manual_analysis | full_now | source_health_check)'
        required: true
        default: 'manual_analysis'

jobs:
  run-queued-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Istanbul
      DB_BACKEND: d1
      FREE_ONLY_MODE: 'true'
      TELEGRAM_ENABLED: 'false'
      DISPATCH_JOB_ID: ${{ github.event.inputs.job_id }}
      DISPATCH_TASK: ${{ github.event.inputs.task }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PANEL_BASE_URL: ${{ secrets.PANEL_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/run_lineup_check.py
