name: AyzEla Kadro ve Kuyruk Takibi

on:
  schedule:
    # Her 30 dakikada canlı/biten skor ve kuyruk senkronizasyonu (sessiz DB güncellemesi)
    - cron: "*/30 9-23 * * *"
    - cron: "0 0-3 * * *"
  workflow_dispatch:

jobs:
  lineup-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Istanbul
      DB_BACKEND: d1
      FREE_ONLY_MODE: "true"
      TELEGRAM_ENABLED: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PANEL_BASE_URL: ${{ secrets.PANEL_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/run_lineup_check.py
