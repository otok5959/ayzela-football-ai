name: AyzEla Sonuç Senkronizasyonu ve Öğrenme

on:
  schedule:
    # 02:30 Europe/Istanbul = 23:30 UTC
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  results-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Istanbul
      DB_BACKEND: d1
      FREE_ONLY_MODE: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/run_results_sync.py
      - run: python scripts/run_backtest.py
